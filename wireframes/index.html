<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cribbage App Wireframes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="side" id="side">
    <div class="brand">
      <div>
        <div class="eyebrow">Wireframes</div>
        <h1>Cribbage</h1>
      </div>
      <button class="theme" id="theme" type="button" aria-label="Toggle light and dark theme">Theme</button>
    </div>
    <nav id="nav" aria-label="Screens"></nav>
    <p class="hint">Click a screen to preview it. Everything inside the phone is clickable.</p>
  </aside>

  <main class="stage">
    <div class="phone-wrap">
      <div class="phone" id="phone"></div>
    </div>
    <div class="notes" id="notes"></div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
